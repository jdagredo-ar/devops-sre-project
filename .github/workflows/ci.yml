name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el codigo del repositorio en el servidor de github
      - name: Checkout code
        uses: actions/checkout@v4
    
    # 2. Configurar entorno de python en el runner
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          