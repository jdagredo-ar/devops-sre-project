name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el codigo del repositorio en el servidor de github
      - name: Checkout code
        uses: actions/checkout@v4
    
    # 2. Configurar entorno de python en el runner
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
    # 3. Instalar dependencias del backend (opcional pero recomendado)
      - name: Install dependencies
        run: |
          cd backend
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Configurar kubectl y validar manifiestos de Kubernetes (Dry-Run)
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validando sintaxis y estructura de los manifiestos de Kubernetes..."
          kubectl apply --dry-run=client -f k8s/

    # 5. Configurar Buildx y construir la imagen de Docker del backend
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: devops-sre-project-backend:latest
          load: true      